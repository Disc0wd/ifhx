# The IFHX tool registry. ifhx fetches this file from GitHub and keeps a copy built into the binary.
#
# To publish a tool, add a [tools.<name>] table. Conventions (override only if you must):
#   - releases are GitHub Releases tagged vX.Y.Z on `repo`
#   - the binary asset is  <bin>-<platform>   (platform: x86_64-linux, aarch64-linux)
#   - its checksum asset is <bin>-<platform>.sha256   (`sha256sum` format)
#   - `ifhx install --source` runs `cargo build --release --locked` in a clone of the tag and takes
#     target/release/<bin>. A registry cannot set a build command.

[tools.ifhf]
repo = "Disc0wd/ifhf"
description = "A friendly command-line frontend for Flatpak"

[tools.ifhai]
repo = "Disc0wd/ifhai"
description = "Makes a downloaded AppImage just work"

[tools.ifhx]
repo = "Disc0wd/ifhx"
description = "Installs and updates the IFHX tool suite"
