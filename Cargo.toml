[package]
name = "ifhx"
version = "0.2.1"
edition = "2024"
description = "Installs and updates the IFHX tool suite"
license = "MIT"

[dependencies]
flate2 = "1.1.11"
minisign-verify = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
