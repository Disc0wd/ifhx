[package]
name = "ifhx"
version = "0.1.0"
edition = "2024"
description = "Installs and updates the IFHX tool suite"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
